name: CI
on:
  push:
    tags:
      - '**'
    branches:
      - master
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  linux:
    uses: ./.github/workflows/ci-linux.yml
    secrets: inherit

  macos:
    # Disabled for now; remove this line to build on macOS again.
    if: false
    uses: ./.github/workflows/ci-macos.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/ci-windows.yml
    secrets: inherit
